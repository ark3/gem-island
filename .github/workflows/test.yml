name: Tests

on:
  push:
  pull_request:

# Test-only workflow: no writes to the repository are needed.
permissions:
  contents: read

# Supersede an in-flight run when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run test suite
        run: node --test
